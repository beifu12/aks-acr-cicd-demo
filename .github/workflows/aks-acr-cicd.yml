name: AKS + ACR CI/CD (Azure China)

on:
  push:
    branches: [ dev-aks-acr ]
  workflow_dispatch:

permissions:
  id-token: write # 必须，用于请求 OIDC 令牌
  contents: read  # 必须，用于拉取代码

jobs:
  # 任务 1: Terraform 基础设施（保持不变，精简输出）
  create-aks-acr:
    runs-on: ubuntu-latest
    outputs:
      acr_login_server: ${{ steps.outputs.outputs.acr_login_server }}
      # 减少密码输出，提高安全性
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: "AzureChinaCloud"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init & Apply
        run: |
            terraform init
            terraform plan -out=tfplan                   # 先生成计划文件
            terraform apply -auto-approve tfplan         # 再应用这个计划文件
        
      - id: outputs
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT

  # 任务 2: 构建镜像（优化：使用 Azure 插件登录）
  build-push-image:
    needs: create-aks-acr
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      # 优化点：使用 azure/docker-login 代替 docker login + admin 密码
      - name: Azure Login (OIDC方式)
        uses: azure/login@v2 # 建议升级到 v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}         # Identity 的 Client ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}         # Azure 租户 ID
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} # 订阅 ID
          environment: "AzureChinaCloud"

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ needs.create-aks-acr.outputs.acr_login_server }}
          username: ${{ secrets.AZURE_CLIENT_ID }} # 建议从 Secret 获取 SP ID
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and Push
        run: |
          REPO=${{ needs.create-aks-acr.outputs.acr_login_server }}/nginx-demo
          docker build -t $REPO:${{ steps.vars.outputs.tag }} .
          docker push $REPO:${{ steps.vars.outputs.tag }}

  # 任务 3: 部署（优化：使用官方 Action 获取上下文）
  deploy-to-aks:
    needs: [create-aks-acr, build-push-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: "AzureChinaCloud"

      # 优化点：使用官方 Action 获取 Kubeconfig，无需手动 base64 转换
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: "aks-demo-rg" # 与 Terraform 中的一致
          cluster-name: "aks-demo-cluster"

      - name: Deploy to AKS
        run: |
          # 动态注入镜像地址
          IMAGE_URL=${{ needs.create-aks-acr.outputs.acr_login_server }}/nginx-demo:${{ needs.build-push-image.outputs.image_tag }}
          
          # 使用 envsubst 或简单的 sed 替换文件中的变量是更专业的做法
          # 这里演示直接 apply
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-demo
          spec:
            replicas: 2 # 建议至少2个以测试负载均衡
            selector:
              matchLabels:
                app: nginx-demo
            template:
              metadata:
                labels:
                  app: nginx-demo
              spec:
                containers:
                - name: nginx-demo
                  image: $IMAGE_URL
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-demo-service
          spec:
            type: LoadBalancer
            selector:
              app: nginx-demo
            ports:
            - port: 80
              targetPort: 80
          EOF

      - name: Verify
        run: kubectl rollout status deployment/nginx-demo